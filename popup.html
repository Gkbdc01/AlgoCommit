<!DOCTYPE html>
<html>
<head>
  <title>AlgoCommit</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      padding: 15px;
      color: #333;
    }
    h1 {
      font-size: 1.4em;
      margin-top: 0;
      text-align: center;
      color: #1a1a1a;
    }
    h3 {
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
      font-weight: 500;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 200px;
      overflow-y: auto;
    }
    li {
      padding: 8px 4px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.9em;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 1em;
      font-weight: bold;
      background-color: #2c974b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background-color: #278441;
    }
    #status {
      margin-top: 10px;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h1>AlgoCommit</h1>

  <div id="login-view">
    <button id="login-button">Login with GitHub</button>
  </div>

  <div id="main-view" style="display:none;">
    <h3>Queued Solutions</h3>
    <ul id="solution-queue">
      </ul>
    <button id="push-button">Push Session to GitHub</button>
    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
